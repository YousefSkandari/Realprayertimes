<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="50%" style="stop-color:#f19033"/>
      <stop offset="100%" style="stop-color:#fad5a5"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fad5a5"/>
      <stop offset="100%" style="stop-color:#f19033"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#sky)"/>

  <!-- Sun rising -->
  <circle cx="256" cy="340" r="80" fill="url(#sun)"/>

  <!-- Sun rays -->
  <g stroke="#fad5a5" stroke-width="8" stroke-linecap="round" opacity="0.8">
    <line x1="256" y1="220" x2="256" y2="180"/>
    <line x1="176" y1="260" x2="148" y2="232"/>
    <line x1="336" y1="260" x2="364" y2="232"/>
    <line x1="140" y1="340" x2="100" y2="340"/>
    <line x1="372" y1="340" x2="412" y2="340"/>
  </g>

  <!-- Horizon line -->
  <rect x="40" y="336" width="432" height="8" rx="4" fill="#1e3a5f" opacity="0.3"/>

  <!-- Mosque silhouette -->
  <path d="M160 400 L160 340 Q200 300 240 340 L240 400 Z" fill="#1e3a5f" opacity="0.6"/>
  <path d="M272 400 L272 340 Q312 300 352 340 L352 400 Z" fill="#1e3a5f" opacity="0.6"/>
  <rect x="194" y="280" width="8" height="60" fill="#1e3a5f" opacity="0.6"/>
  <rect x="306" y="280" width="8" height="60" fill="#1e3a5f" opacity="0.6"/>

  <!-- Ground -->
  <rect x="0" y="400" width="512" height="112" rx="0" fill="#1e3a5f" opacity="0.8"/>
</svg>
